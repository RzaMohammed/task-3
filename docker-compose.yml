services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: face-verifier-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/models:/app/models:ro
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - FACE_MODEL_ROOT=/app/models
    networks:
      - face-verifier-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: face-verifier-backend
    ports:
      - "5000:5000"
    environment:
      - BACKEND_PORT=5000
      - PORT=5000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost:5173
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-mock}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - SOLANA_PRIVATE_KEY=${SOLANA_PRIVATE_KEY:-}
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - face-verifier-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000
    container_name: face-verifier-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - face-verifier-net
    restart: unless-stopped

networks:
  face-verifier-net:
    driver: bridge
